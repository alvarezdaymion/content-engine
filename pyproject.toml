[project]
name = "content-engine"
version = "0.1.0"
description = "Q&A video pipeline built around one weekly recording session: ranked ideas, question cards, take matching, word-by-word captions, numbered review and an at-most-once publisher."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daymion Alvarez" }]
dependencies = []

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]

[project.scripts]
content-engine = "content_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP031"]
